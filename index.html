<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玻璃化转变 · 一场降温实验</title>
  <meta name="description" content="把熔体降温，看链段冻进玻璃：Kremer–Grest 珠簧模型的实时分子动力学，浏览器里跑。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23131a26'/><text x='5' y='23' font-family='Georgia,serif' font-weight='700' font-size='17' fill='%23e8a33d'>Tg</text></svg>" />
  <link rel="stylesheet" href="./src/style.css?v=22" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 全屏模拟：整页的背景就是分子宇宙 -->
  <div id="viewport"></div>
  <div id="veil"></div>

  <!-- 抬头 -->
  <header id="topbar">
    <span id="mark">Tg</span>
    <span class="spacer"></span>
    <nav id="topnav">
      <button id="figsToggle" class="ghostbtn">曲线</button>
      <a class="ghostbtn" href="https://github.com/Glory0707/polymer-glass-lab" target="_blank" rel="noopener" id="repoLink">GitHub</a>
    </nav>
  </header>

  <!-- 主标题：电影标题卡 -->
  <div id="hero">
    <h1>玻璃化转变</h1>
  </div>

  <!-- 右上读数：纯 HUD 文字，无框 -->
  <div id="readout">
    <div id="heroT"><b id="vT">—</b><span class="unit">ε/kB<em id="vTmeas"></em></span></div>
    <div class="r"><i>PE</i><b id="vPE">—</b><span>ε/珠</span></div>
    <div class="r"><i>MSD</i><b id="vMSD">—</b><span>σ²</span></div>
    <div class="r"><i>Tg</i><b id="vTg">—</b></div>
    <div class="r dim"><i>τ</i><b id="vTau">—</b><span id="vFps"></span></div>
  </div>

  <!-- 左下控制簇 -->
  <div id="controls">
    <button id="btnCool" class="pill hot">降温</button>
    <button id="btnHeat" class="pill">升温</button>
    <button id="btnQuench" class="pill">急冷</button>
    <button id="btnMelt" class="pill">熔化</button>
    <button id="btnPause" class="pill">暂停</button>
    <span class="vsep"></span>
    <button id="paramsToggle" class="pill">⚙ 样品</button>
  </div>

  <!-- 样品参数浮层 -->
  <div id="paramsPop" class="pop hidden">
    <div class="pgroup">
      <h3>样品</h3>
      <div class="kv"><span class="k">规模</span><span class="spacer"></span>
        <select id="sizeSel">
          <option value="30">1200 珠</option>
          <option value="60" selected>2400 珠</option>
          <option value="120">4800 珠</option>
        </select>
      </div>
      <div class="kv"><span class="k">组分</span><span class="spacer"></span>
        <select id="compSel">
          <option value="0" selected>单分散</option>
          <option value="0.1">10% 小珠</option>
          <option value="0.25">25% 小珠</option>
        </select>
      </div>
      <div class="kv"><span class="k">密度</span><span class="spacer"></span><output id="densityVal">1.00</output><span class="unit">σ⁻³</span></div>
      <input type="range" id="densitySlider" min="0.6" max="1.3" step="0.01" value="1.0" />
      <div class="kv"><span class="k">种子</span><span class="spacer"></span><span id="seedVal" class="mini mono">—</span>
        <button id="btnNew" class="pill mini-pill">新样本</button>
      </div>
    </div>
    <div class="pgroup">
      <h3>动力学</h3>
      <div class="kv"><span class="k">速率</span><span class="spacer"></span><output id="rateVal">1.0×10⁻³</output><span class="unit">ε/τ</span></div>
      <input type="range" id="rateSlider" min="0" max="100" value="43" />
      <div class="kv"><span class="k">速度</span><span class="spacer"></span><output id="speedVal">16</output><span class="mini">步/帧</span></div>
      <input type="range" id="speedSlider" min="1" max="40" value="16" />
      <div class="kv"><span class="k">链刚度</span><span class="spacer"></span><output id="stiffnessVal">0</output></div>
      <input type="range" id="stiffnessSlider" min="0" max="10" step="0.25" value="0" />
      <div class="kv"><span class="k">恒压</span><span class="spacer"></span>
        <label class="chk"><input type="checkbox" id="nptChk" />NPT</label>
        <input type="range" id="p0Slider" min="0" max="20" step="1" value="10" style="width:72px" />
        <output id="p0Val" class="mini">10</output>
      </div>
      <div class="kv"><span class="k">参考点</span><span class="spacer"></span><button id="btnResetRef" class="pill mini-pill">归零</button></div>
    </div>
    <div class="pgroup">
      <h3>力学</h3>
      <div class="kv"><span class="k">模式</span><span class="spacer"></span>
        <select id="defModeSel">
          <option value="none" selected>无</option>
          <option value="stretch">单轴拉伸</option>
          <option value="cyclic">循环拉伸</option>
        </select>
      </div>
      <div class="kv" id="defRateGroup"><span class="k">应变率</span><span class="spacer"></span><output id="defRateVal">0.020</output><span class="unit">1/τ</span></div>
      <input type="range" id="defRateSlider" min="0.005" max="0.1" step="0.005" value="0.02" />
      <div class="kv" id="defCycGroup" hidden><span class="k">振幅</span><span class="spacer"></span><output id="defAmpVal">0.12</output></div>
      <input type="range" id="defAmpSlider" min="0.02" max="0.3" step="0.01" value="0.12" hidden />
      <div class="kv" id="defFreqGroup" hidden><span class="k">频率</span><span class="spacer"></span><output id="defFreqVal">0.50</output><span class="unit">1/τ</span></div>
      <input type="range" id="defFreqSlider" min="0.1" max="2" step="0.05" value="0.5" hidden />
      <div class="kv"><span class="k">应变</span><span class="spacer"></span><output id="strainVal" class="mini">—</output>
        <button id="btnRelease" class="pill mini-pill">释放</button></div>
    </div>
    <div class="pgroup">
      <h3>显示</h3>
      <div class="kv"><span class="k">珠色</span><span class="spacer"></span>
        <select id="colorSel">
          <option value="mobility" selected>迁移率</option>
          <option value="chain">按链</option>
          <option value="chi">非均匀性</option>
        </select>
      </div>
      <div class="kv"><span class="k">叠加</span><span class="spacer"></span>
        <label class="chk"><input type="checkbox" id="bondsChk" checked />键</label>
        <label class="chk"><input type="checkbox" id="boxChk" checked />框</label>
      </div>
      <div class="kv"><span class="k">串</span><span class="spacer"></span>
        <label class="chk"><input type="checkbox" id="stringsChk" />合作串</label>
      </div>
    </div>
  </div>

  <!-- 温度轨：页面底边 -->
  <div id="rail">
    <div id="railScale">
      <i style="left:3.4%">0.1</i>
      <i class="tg" style="left:24%">Tg≈0.4</i>
      <i style="left:65.5%">1.0</i>
    </div>
    <div id="railWrap">
      <input type="range" id="tempSlider" min="0.05" max="1.5" step="0.01" value="1.0" aria-label="温度" />
      <div id="railBand" aria-hidden="true"></div>
      <div id="railBubble">1.00</div>
    </div>
    <div id="railEnds"><span>冷 0.05</span><span>1.50 热</span></div>
  </div>

  <!-- 曲线浮层 -->
  <aside id="figs" class="panel">
    <button id="figsClose" class="pill" aria-label="关闭">×</button>
    <figure>
      <figcaption><span>均方位移</span></figcaption>
      <canvas id="msdPlot"></canvas>
    </figure>
    <figure>
      <figcaption><span>热历史</span></figcaption>
      <canvas id="histPlot"></canvas>
    </figure>
    <figure>
      <figcaption><span>非高斯参数 α₂</span></figcaption>
      <canvas id="a2Plot"></canvas>
    </figure>
    <figure>
      <figcaption><span>van Hove G_s(r, 5τ)</span></figcaption>
      <canvas id="vhPlot"></canvas>
    </figure>
    <figure>
      <figcaption><span>力学响应</span></figcaption>
      <canvas id="stressPlot"></canvas>
    </figure>
    <figure>
      <figcaption><span>记忆实验</span><span class="mini" id="protoState"></span></figcaption>
      <canvas id="protoPlot"></canvas>
      <div class="kv"><span class="k">阶梯</span><input type="text" id="protoSeq" value="1.2 3000, 0.6 6000, 0.9 4000" /></div>
      <div class="btns">
        <button id="btnProto" class="pill">跑协议</button>
        <button id="btnProtoStop" class="pill">停</button>
      </div>
    </figure>
    <figure>
      <figcaption><span>力学响应</span></figcaption>
      <canvas id="stressPlot"></canvas>
    </figure>
    <figure>
      <figcaption><span>记忆实验</span><span class="mini" id="protoState"></span></figcaption>
      <canvas id="protoPlot"></canvas>
      <div class="kv"><span class="k">阶梯</span><input type="text" id="protoSeq" value="1.2 3000, 0.6 6000, 0.9 4000" /></div>
      <div class="btns">
        <button id="btnProto" class="pill">▶ 跑协议</button>
        <button id="btnProtoStop" class="pill">停止</button>
      </div>
      <p class="mini">PE(t) 非单调回弹 = 玻璃记忆。</p>
    </figure>
    <div id="exportRow">
      <span class="mini">数据导出</span><span class="spacer"></span>
      <button id="btnCsv" class="pill">CSV</button>
      <button id="btnJson" class="pill">JSON</button>
    </div>
  </aside>

  <div id="anneal" hidden>制备样品 · 退火 <span id="annealPct">0%</span></div>

  <div id="fatal" hidden>
    <div>出错了：<span id="fatalMsg"></span></div>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const msg = (e.error && e.error.message) || e.message || '';
      if (!msg || /ResizeObserver loop/.test(msg)) return;
      const el = document.getElementById('fatalMsg');
      if (el) { el.textContent = msg; document.getElementById('fatal').hidden = false; }
    }, true);
  </script>
  <script type="module" src="./src/main.js?v=22"></script>
</body>
</html>
